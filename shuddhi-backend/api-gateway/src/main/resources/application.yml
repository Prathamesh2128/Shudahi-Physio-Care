server:
  port: 8000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # 🔐 Auth Service
        - id: auth-service
          uri: http://localhost:8001
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=3

        # 👤 Patient Service
        - id: patient-service
          uri: http://localhost:8002
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=2

        # 👨‍⚕️ Doctor Service
        - id: doctor-service
          uri: http://localhost:8003
          predicates:
            - Path=/api/doctors/**
          filters:
            - StripPrefix=2

        # 📅 Appointment Service
        - id: appointment-service
          uri: http://localhost:8004
          predicates:
            - Path=/api/appointments/**
          filters:
            - StripPrefix=2
